# /etc/nginx/sites-available/imot-mcp
#
# TLS is terminated here; the container listens on 127.0.0.1:8099 only.
#
# RUN `certbot --nginx -d imot-mcp.pixelautomate.com` AFTER INSTALLING THIS FILE.
#
# The 443 listener must name this host's IP explicitly. Other vhosts on this box
# (media, pdf) already bind 76.13.137.79:443, and a more specific listener wins
# over a wildcard one: a `listen 443` block here is never selected for traffic
# arriving on that address, so nginx falls back to the default vhost for the
# address and serves the WRONG certificate (observed: media.pixelautomate.com's
# cert for this hostname, which makes TLS verification fail).
#
# Streaming matters: MCP streamable HTTP holds a long-lived SSE response open,
# so proxy buffering must be off and the read timeout must be long.
server {
    server_name imot-mcp.pixelautomate.com;

    listen 76.13.137.79:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/imot-mcp.pixelautomate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imot-mcp.pixelautomate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8099;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-sent events must not be buffered or timed out early.
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;

        # The tool calls can legitimately take a few seconds (live scrape).
        client_max_body_size 4m;
        client_body_timeout  60s;
    }
}

# Plain HTTP is redirected to HTTPS by certbot's additional block.
server {
    listen 80;
    listen [::]:80;
    server_name imot-mcp.pixelautomate.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
